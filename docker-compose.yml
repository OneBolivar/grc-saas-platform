services:
  postgres:
    image: postgres:16-alpine
    container_name: grc_saas_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-grc_saas_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - grc_network

volumes:
  pgdata:
    driver: local

networks:
  grc_network:
    driver: bridge